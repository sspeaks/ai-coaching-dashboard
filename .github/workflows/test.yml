name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run backend pytest suite
        timeout-minutes: 10
        run: python -m pytest
      - name: Run live API contract integration
        timeout-minutes: 2
        run: python -m unittest -v tests.api.test_live_api_contract

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  deterministic-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic evaluation tests
        run: |
          python3 -m unittest discover -s tests/fixtures -v
          python3 -m unittest discover -s tests/eval -v
      - name: Score the redistributable gold fixture
        run: |
          python3 -m eval.score \
            --gold fixtures/synthetic/quartet-coaching-01/gold-ledger.json \
            --predicted fixtures/synthetic/quartet-coaching-01/gold-ledger.json \
            --transcript fixtures/synthetic/quartet-coaching-01/transcript.json
      - name: Validate lightweight browser scenario manifest (not browser E2E)
        run: python3 -m unittest discover -s tests/browser -v
      - name: Prove critical hallucinations are rejected
        run: |
          if python3 -m eval.score \
            --gold fixtures/synthetic/quartet-coaching-01/gold-ledger.json \
            --predicted fixtures/synthetic/quartet-coaching-01/adversarial-ledger.json \
            --transcript fixtures/synthetic/quartet-coaching-01/transcript.json; then
            echo "adversarial critical claims unexpectedly passed"
            exit 1
          fi

  nixos-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require NixOS module and fresh-deploy/backup-restore checks
        run: python3 -m unittest discover -s tests/nix -v
      - name: Run all Nix flake checks
        run: nix flake check --print-build-logs
