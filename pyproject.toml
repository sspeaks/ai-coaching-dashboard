[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coaching-evidence-backend"
version = "0.1.0"
description = "Evidence-grounded coaching session backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8.3,<9"]

[project.scripts]
evidence-api = "evidence_api.app:run"
evidence-worker = "evidence_worker.worker:run"
extraction-gateway = "extraction_gateway.app:run"

[tool.setuptools.packages.find]
where = [
  "packages/contracts",
  "services/evidence-api",
  "services/evidence-worker",
  "services/extraction-gateway",
  "services/media-adapter",
]
include = ["coaching_contracts*", "evidence_api*", "evidence_worker*", "extraction_gateway*", "media_adapter*"]

[tool.pytest.ini_options]
testpaths = ["services/evidence-api/tests", "services/evidence-worker/tests", "services/extraction-gateway/tests"]
addopts = "-q"
